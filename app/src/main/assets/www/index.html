  function dbPut(v){ return db().then(function(d){ if(!d){ (mem[v.alb]=mem[v.alb]||[]).push(v); return; } return new Promise(function(res){ var t=d.transaction('f','readwrite'); t.objectStore('f').put(v); t.oncomplete=res; t.onerror=res; }); }); }
  function dbDel(v){ return db().then(function(d){ if(!d){ mem[v.alb]=(mem[v.alb]||[]).filter(function(x){ return x.id!==v.id; }); return; } return new Promise(function(res){ var t=d.transaction('f','readwrite'); t.objectStore('f').delete(v.id); t.oncomplete=res; t.onerror=res; }); }); }
  function shrink(file){ return new Promise(function(res){ if(!/^image\/(jpeg|png|webp)/.test(file.type)) return res(file); var u=URL.createObjectURL(file); var im=new Image(); im.onload=function(){ var m=1600, w=im.width, h=im.height; if(w<=m&&h<=m){ URL.revokeObjectURL(u); return res(file); } var k=Math.min(m/w,m/h); var c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(u); c.toBlob(function(b){ res(b||file); },'image/jpeg',0.86); }; im.onerror=function(){ res(file); }; im.src=u; }); }
  function initAlbum(box){
    if(box.__ok) return; box.__ok=true;
    var alb=box.getAttribute('data-album')||'album';
    var grid=box.querySelector('.ase-album-grid'); var btn=box.querySelector('.ase-album-add'); if(!grid) return;
    var inp=document.createElement('input'); inp.type='file'; inp.multiple=true; inp.accept=box.getAttribute('data-accept')||'image/*,video/*'; inp.style.display='none'; box.appendChild(inp);
    var urls=[];
    function render(){ dbAll(alb).then(function(list){ list.sort(function(a,b){ return b.t-a.t; }); urls.forEach(function(u){ URL.revokeObjectURL(u); }); urls=[];
      grid.innerHTML=list.length?'':'<p style="grid-column:1/-1;text-align:center;opacity:.7;padding:20px 8px;margin:0">Aún no hay fotos. Toca «'+(btn?btn.textContent.trim():'Añadir')+'» para subir las tuyas 📷</p>';
      var items=list.map(function(v){ var u=URL.createObjectURL(v.blob); urls.push(u); return {type:/^video/.test(v.blob.type)?'video':'img',src:u,blob:v.blob,rec:v}; });
      items.forEach(function(it,i){ var cell=document.createElement('div'); cell.style.cssText='position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#0002;cursor:pointer';
        var m=document.createElement(it.type==='video'?'video':'img'); m.src=it.src; m.muted=true; m.style.cssText='width:100%;height:100%;object-fit:cover;display:block'; cell.appendChild(m);
        if(it.type==='video'){ var p=document.createElement('span'); p.textContent='▶'; p.style.cssText='position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:28px;text-shadow:0 2px 6px #000'; cell.appendChild(p); }
        cell.onclick=function(){ if(window.__aseEditing) return; openViewer(items,i,{onDelete:function(x){ dbDel(x.rec).then(render); }}); };
        grid.appendChild(cell); });
      var cnt=box.querySelector('.ase-album-count'); if(cnt) cnt.textContent=list.length+(list.length===1?' elemento':' elementos');
    }); }
    if(btn) btn.addEventListener('click',function(e){ if(window.__aseEditing) return; e.preventDefault(); inp.click(); });
    inp.onchange=function(){ var fs=Array.prototype.slice.call(inp.files||[]); inp.value=''; if(!fs.length) return; toastMsg('Guardando '+fs.length+'…');
      Promise.all(fs.map(function(f,i){ return shrink(f).then(function(b){ return dbPut({id:Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2,7),alb:alb,t:Date.now()+i,blob:b}); }); })).then(function(){ toastMsg('✅ Guardado'); render(); }); };
    render();
  }
  // ---------- cuenta regresiva ----------
  function initCount(box){
    if(box.__ok) return; box.__ok=true;
    function tick(){ var t=new Date(box.getAttribute('data-fecha')||'').getTime(); var d=t-Date.now(); var parts={d:0,h:0,m:0,s:0};
      if(!isNaN(t)&&d>0){ parts.d=Math.floor(d/864e5); parts.h=Math.floor(d%864e5/36e5); parts.m=Math.floor(d%36e5/6e4); parts.s=Math.floor(d%6e4/1e3); }
      ['d','h','m','s'].forEach(function(k){ var e=box.querySelector('.ase-c-'+k); if(e) e.textContent=String(parts[k]).padStart(2,'0'); });
      var done=box.querySelector('.ase-c-done'); if(done) done.style.display=(!isNaN(t)&&d<=0)?'block':'none'; }
    tick(); setInterval(tick,1000);
  }
  // ---------- música de fondo ----------
  function initMusic(box){
    if(box.__ok) return; box.__ok=true; var a=box.querySelector('audio'), b=box.querySelector('button'); if(!a||!b) return;
    a.loop=true; function upd(){ b.textContent=a.paused?'🎵':'⏸️'; }
    b.addEventListener('click',function(e){ if(window.__aseEditing) return; e.preventDefault(); if(a.paused) a.play().catch(function(){}); else a.pause(); upd(); });
    if(box.getAttribute('data-auto')==='1'){ var go=function(){ if(window.__aseEditing) return; a.play().then(upd).catch(function(){}); document.removeEventListener('touchstart',go); document.removeEventListener('click',go); }; document.addEventListener('touchstart',go); document.addEventListener('click',go); }
    upd();
  }
  // ---------- ambiente animado ----------
  var SETS={corazones:['💖','💕','💗','❤️','💓'],estrellas:['⭐','✨','🌟','💫'],confeti:['🎉','🎊','✨','🎈'],burbujas:['🫧','⚪','🔵'],nieve:['❄️','❅','❆'],petalos:['🌸','🌺','🌷','🌹'],mariposas:['🦋','🌸','✨'],musica:['🎵','🎶','✨'],dinero:['💰','💵','✨'],hojas:['🍃','🍂','🍁']};
  function initFx(box){
    if(box.__ok) return; box.__ok=true;
    var set=SETS[box.getAttribute('data-tipo')]||SETS.corazones; var n=parseInt(box.getAttribute('data-cantidad')||'18',10);
    var layer=document.createElement('div'); layer.style.cssText='position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9998';
    document.body.appendChild(layer);
    var st=document.createElement('style'); st.textContent='@keyframes aseFall{0%{transform:translateY(-10vh) rotate(0)}100%{transform:translateY(110vh) rotate(360deg)}}'; document.head.appendChild(st);
    for(var i=0;i<n;i++){ var s=document.createElement('span'); s.textContent=set[i%set.length]; var dur=6+Math.random()*8;
      s.style.cssText='position:absolute;top:0;left:'+(Math.random()*100)+'vw;font-size:'+(14+Math.random()*18)+'px;opacity:'+(0.5+Math.random()*0.5)+';animation:aseFall '+dur+'s linear '+(-Math.random()*dur)+'s infinite';
      layer.appendChild(s); }
  }
  // ---------- formulario a WhatsApp ----------
  document.addEventListener('submit',function(e){ var f=e.target; if(!f.hasAttribute||!f.hasAttribute('data-ase-wa')) return; e.preventDefault(); if(window.__aseEditing) return;
    var txt=all('input,textarea,select',f).filter(function(i){ return i.name||i.placeholder; }).map(function(i){ return (i.name||i.placeholder)+': '+i.value; }).join('\n');
    var url='https://wa.me/'+(f.getAttribute('data-ase-wa')||'').replace(/\D/g,'')+'?text='+encodeURIComponent(txt);
    if(window.Android&&Android.open) Android.open(url); else window.open(url,'_blank'); });
  function init(){ all('[data-ase-block="album"]').forEach(initAlbum); all('[data-ase-block="cuenta"]').forEach(initCount); all('[data-ase-block="musica"]').forEach(initMusic); all('[data-ase-block="ambiente"]').forEach(initFx); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
})();</script></body></html>
